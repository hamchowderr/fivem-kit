name: CI

# Runs on every push to main and every PR. This is the check that replaces "I remembered to
# run the tests" — the repo ships direct to main, so main itself has to be the thing that is
# continuously verified.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # `package.json` promises `engines: >=20` to every npm consumer. This is what turns that
  # promise into something checked rather than asserted.
  #
  # The floor tracks Node's actual support window rather than sitting still. 18 went EOL on
  # 2025-04-30 and was still in this matrix a year later — a green tick asserting support for
  # a runtime that receives no security patches, which is a claim we could not honour if it
  # broke. 20 (EOL 2026-04-30) stays as a grace tier because installed editors still ship it;
  # 24 is LTS to 2028 and is where people are moving.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      # The corpus tests enumerate documentation repositories through the GitHub API.
      # Unauthenticated that is 60 requests/hour PER IP, and a runner's IP is shared with
      # every other job on the host — so the quota is not ours and can already be spent.
      # Three matrix jobs racing for it is what produced a 403 on node 24 while 20 and 22
      # passed, which reads exactly like a version-specific bug and is not one.
      - name: Test
        working-directory: mcp
        run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      # The plugin is the other half of this repo and has no dependencies to install, so it
      # is validated with the real CLI rather than a hand-rolled schema check.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json

      # Every ox API this project documents must exist in the real ox sources. This is what
      # stops the docs drifting into APIs that were never real — the whole point of the kit.
      #
      # The sources have to be cloned: without them the script exits 2 ("sources not found")
      # and the step fails for a reason that has nothing to do with the docs. Shallow clones
      # of upstream mean this checks against ox as it is TODAY, so an upstream rename shows
      # up here rather than in a user's editor.
      # Uses the same source list as local development (scripts/sources.mjs), so CI and a
      # developer's machine cannot disagree about what gets verified. A hand-written clone
      # loop here is what drifted from the verifier's targets and broke the build once.
      # --no-docs: the prose documentation repos are large and nothing here reads them. They
      # are a writing source, not a verification source.
      - name: Clone ox and framework sources
        run: node scripts/update-sources.mjs --root "$RUNNER_TEMP" --no-docs

      # --strict: every resource must be present. Without it, a clone that produced an empty
      # directory would skip that resource and still exit 0 — a green tick on a check that
      # never ran.
      - name: Verify documented APIs against source
        env:
          FRAMEWORK_RESOURCES: ${{ runner.temp }}/frameworks
        run: node scripts/verify-docs.mjs "$RUNNER_TEMP/ox" --strict

      - name: Release gate (version consistency + changelog)
        run: node scripts/check-release.mjs

      # Build the tarball exactly as `npm publish` would, then assert the corpus actually
      # made it in. The corpus is generated by prepack from the plugin's skills, so it exists
      # only inside the tarball — a packaging regression is invisible until a user installs.
      - name: Inspect the tarball
        working-directory: mcp
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const p = require('/tmp/pack.json')[0];
            const files = p.files.map(f => f.path);
            const need = ['src/index.mjs', 'README.md'];
            const missing = need.filter(n => !files.includes(n));
            if (missing.length) { console.error('missing from tarball:', missing.join(', ')); process.exit(1); }
            const corpus = files.filter(f => f.startsWith('corpus/'));
            if (corpus.length < 15) { console.error('corpus looks short:', corpus.length, 'files'); process.exit(1); }
            const leaked = files.filter(f => f.startsWith('test/') || f.includes('node_modules'));
            if (leaked.length) { console.error('should not ship:', leaked.join(', ')); process.exit(1); }
            console.log('tarball ok —', p.name + '@' + p.version, files.length, 'files,', corpus.length, 'corpus files');
          "

      # Prove the published artefact actually speaks MCP, rather than merely packing.
      - name: Smoke-test the server over stdio
        working-directory: mcp
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 node src/index.mjs > /tmp/mcp.jsonl
          node -e "
            const fs = require('fs');
            const msgs = fs.readFileSync('/tmp/mcp.jsonl','utf8').trim().split('\n').map(JSON.parse);
            const init = msgs.find(m => m.id === 1).result;
            const tools = msgs.find(m => m.id === 2).result.tools;
            if (init.protocolVersion !== '2025-11-25') { console.error('negotiated', init.protocolVersion); process.exit(1); }
            if (tools.length !== 5) { console.error('expected 5 tools, got', tools.length); process.exit(1); }
            console.log('mcp ok —', init.serverInfo.name, init.protocolVersion, tools.length + ' tools');
          "
